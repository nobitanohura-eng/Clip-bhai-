# ClipAI v2 — Gradle properties.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# 16 KB page-size alignment (Android 15+): a warning today becomes a native-lib
# load failure on 16 KB-page devices. Native libs (Sherpa-ONNX, LiteRT-LM,
# MediaPipe) must be 16 KB aligned.
# useLegacyPackaging=false keeps native .so files uncompressed in the APK so
# the platform can load them page-aligned. Verify on a 16 KB emulator on the
# first GitHub Actions run (see research §5, bug #8).
android.useLegacyPackaging=false

# Kotlin / Compose compiler flags.
kotlin.code.style=official
android.nonFinalResIds=true
